<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cinematic Clip Frame</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== MAIN FRAME ===== */
    .frame {
      position: relative;
      width: 900px;
      height: 500px;
      border: 2px solid #fff; /* 🔥 THINNER BORDER */
      overflow: hidden;
    }

    /* ===== CENTER IMAGE ===== */
    .center-img {
      position: absolute;
      inset: 0;
      background: url("https://images.unsplash.com/photo-1521412644187-c49fa049e84d")
        center / cover no-repeat;
      z-index: 1;
    }

    /* ===== CLIP OVERLAY ===== */
    .clip {
      position: absolute;
      left: 50%;
      top: 45%; /* 🎯 THIS IS THE ONLY VALUE YOU MOVE */
      transform: translate(-50%, -50%);
      width: 60%;
      height: 60%;
      border: 2px solid white; /* thinner inner border */
      clip-path: polygon(
        5% 0%,
        95% 0%,
        100% 50%,
        95% 100%,
        5% 100%,
        0% 50%
      );
      z-index: 2;
    }

    /* ===== TEXT ===== */
    .text {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 3;
    }

    .text h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    .text p {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="center-img"></div>

    <div class="clip"></div>

    <div class="text">
      <h1>YOUR TITLE</h1>
      <p>Your cinematic subtitle goes here</p>
    </div>
  </div>
</body>
</html>
