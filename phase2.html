<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 2 - Sporting CP Journey</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@1,400&family=Road+Rage&display=swap');

* {
    transition: 
        opacity 0.6s ease,
        transform 0.6s ease,
        background-color 0.4s ease,
        box-shadow 0.4s ease,
        color 0.3s ease,
        filter 0.4s ease;
}

body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    perspective: 1200px;
    -webkit-font-smoothing: antialiased;
}

/* MENU BUTTON */
.menu-top-right {
    position: absolute;
    top: 45px;
    right: 45px;
    z-index: 1000;
}

.green-master-btn {
    font-family: 'Cinzel', serif;
    background: #00d668;
    border: 2px solid #00d668;
    color: #000;
    padding: 12px 30px;
    text-transform: uppercase;
    font-weight: bold;
    font-size: 0.8rem;
    letter-spacing: 2px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 0 15px rgba(0, 214, 104, 0.6);
}

.green-master-btn:hover {
    background: #000;
    color: #00d668;
    box-shadow: 0 0 25px rgba(0, 214, 104, 0.8);
}

/* BACKGROUND IMAGE */
.full-screen-bg {
    position: absolute;
    top: 2%;
    left: 2%;
    width: 96%;
    height: 96%;
    z-index: 1;
    overflow: hidden;
    border: 1px solid #00d668;
    box-shadow: 0 0 15px rgba(0, 214, 104, 0.4);
    border-radius: 12px;

    background-image: url("https://mir-s3-cdn-cf.behance.net/project_modules/1400/b3e1f094805131.63e95be677318.png");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center 46%;
}

/* OVERLAY */
.video-dark-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.85) 30%,
        rgba(0, 0, 0, 0.2) 100%
    );
    z-index: 2;
    pointer-events: none;
}

/* CONTENT */
.content-overlap-wrapper {
    position: relative;
    width: 88vw;
    max-width: 1200px;
    height: 80vh;
    z-index: 3;
    display: flex;
    align-items: flex-end;
}

.text-column-left {
    flex: 1.2;
    padding: 0 40px 60px 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

.image-column-right {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

/* SIDE IMAGE */
.foreground-cutout {
    height: 75%;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(0, 214, 104, 0.6));
}

/* TEXT */
.karuppu-style-header {
    font-family: 'Road Rage', sans-serif;
    font-size: 5rem;
    color: #ffffff;
    letter-spacing: 2px;
    margin: 0 0 20px 0;
    text-transform: uppercase;
    text-shadow:
        0px 0px 20px rgba(0, 214, 104, 0.5),
        4px 4px 0px #000000;
    transform: skewX(-4deg) rotate(-1deg);
}

.elegant-narrative-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    line-height: 1.9;
    color: #ffffff;
    font-style: italic;
    margin: 0 0 40px 0;
    max-width: 540px;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 1);
}

/* BUTTONS */
.navigation-row {
    display: flex;
    gap: 20px;
}

.action-control-btn {
    font-family: 'Cinzel', serif;
    background: transparent;
    border: 1px solid #00d668;
    color: #00d668;
    padding: 12px 35px;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 2px;
    cursor: pointer;
    text-decoration: none;
}

.action-control-btn:hover {
    background: #00d668;
    color: #000000;
    box-shadow: 0 0 25px rgba(0, 214, 104, 0.5);
}
</style>
</head>

<body>

<div class="full-screen-bg">
    <div class="video-dark-overlay"></div>
</div>

<div class="menu-top-right">
    <a class="green-master-btn" href="menu.html">MENU</a>
</div>

<div class="content-overlap-wrapper">
    <div class="text-column-left">
        <h2 class="karuppu-style-header">SPORTING CP ASCENT</h2>
        <p class="elegant-narrative-text">
            Leaving Madeira at just 12 years old for Lisbon, Cristiano faced immense homesickness while mastering his craft at the Alcochete academy.
        </p>
        <div class="navigation-row">
            <a class="action-control-btn" href="phase1.html">← ROOTS OF THE GOAT</a>
            <a class="action-control-btn" href="phase3.html">MANCHESTER UNITED →</a>
        </div>
    </div>

    <div class="image-column-right">
        <img class="foreground-cutout" src="images-removebg-preview (1).png">
    </div>
</div>

</body>
</html>
