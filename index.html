<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display&display=swap');

        body { 
            margin: 0; height: 100vh; overflow: hidden;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://i.pinimg.com/736x/79/99/e4/7999e451d14423145f36e3b084cefcaf.jpg') no-repeat center center/cover; 
            font-family: 'Cinzel', serif; color: #fff; display: flex; flex-direction: column;
            animation: flashEntrance 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: opacity 0.5s ease;
        }
        
        /* Exit Animation */
        .exit-transition { opacity: 0; transform: scale(0.95); }
        
        @keyframes flashEntrance {
            0% { opacity: 0; filter: blur(20px) brightness(5); transform: scale(1.1); }
            100% { opacity: 1; filter: blur(0px) brightness(1); transform: scale(1); }
        }

        .header { display: flex; justify-content: center; padding: 20px; gap: 10px; border-bottom: 2px solid #d4af37; background: rgba(0,0,0,0.5); }
        .nav-btn { color: #d4af37; text-decoration: none; padding: 8px 16px; border: 1px solid #d4af37; text-transform: uppercase; font-size: 0.7rem; transition: 0.3s; cursor: pointer; }
        .nav-btn:hover { background: #d4af37; color: #000; box-shadow: 0 0 15px #d4af37; }

        .main-content { display: flex; flex: 1; padding: 50px; gap: 50px; align-items: center; }
        .left-panel { flex: 2; }
        
        h1 { font-family: 'ZCOOL KuaiLe', cursive; font-size: 5rem; margin: 0; text-shadow: 0 0 20px #d4af37; letter-spacing: 5px; }

        .search-bar { width: 60%; padding: 15px; background: rgba(0,0,0,0.8); border: 2px solid #d4af37; color: #fff; font-size: 1.2rem; }
        
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .display-img { 
            width: 100%; height: 350px; border: 2px solid #d4af37; 
            background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTszHo5YIakFyVmJSW0PED0_3ZjYUugfDeA1-whOSynLQ&s=10') no-repeat center center/cover;
            transition: transform 0.5s;
        }
        .display-img:hover { transform: scale(1.02); }
        
        .walk-btn { padding: 20px; background: #d4af37; color: #000; text-align: center; text-decoration: none; font-weight: bold; text-transform: uppercase; transition: 0.3s; cursor: pointer; }
        .walk-btn:hover { background: #fff; box-shadow: 0 0 30px #fff; }
    </style>
</head>
<body>
    <div class="header" id="nav-header">
        <a href="menu.html" class="nav-btn">JOURNEY</a>
        <a href="phase1.html" class="nav-btn">ROOTS</a>
        <a href="phase2.html" class="nav-btn">SPORTING</a>
        <a href="phase3.html" class="nav-btn">UNITED</a>
        <a href="phase4.html" class="nav-btn">MADRID</a>
        <a href="phase5.html" class="nav-btn">JUVENTUS</a>
        <a href="phase6.html" class="nav-btn">AL NASSR</a>
        <a href="phase7.html" class="nav-btn">PORTUGAL</a>
        <a href="phase8.html" class="nav-btn">CAREER STATS</a>
    </div>

    <div class="main-content">
        <div class="left-panel">
            <h1>CRISTIANO RONALDO</h1>
            <input type="text" id="search" class="search-bar" placeholder="Search phases (e.g. 'Madrid')...">
        </div>
        <div class="right-panel">
            <div class="display-img"></div>
            <a href="phase1.html" class="walk-btn">BEGIN WALKTHROUGH</a>
        </div>
    </div>

    <script>
        // Smooth search filtering (uses inline-block to preserve flex header architecture)
        document.getElementById('search').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const links = document.querySelectorAll('.nav-btn');
            links.forEach(link => {
                link.style.display = (query === "" || link.textContent.toLowerCase().includes(query)) ? 'inline-block' : 'none';
            });
        });

        // Navigation transition handler
        document.querySelectorAll('.nav-btn, .walk-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                const target = this.getAttribute('href');
                document.body.classList.add('exit-transition');
                setTimeout(() => {
                    window.location.href = target;
                }, 500);
            });
        });
    </script>
</body>
</html>
