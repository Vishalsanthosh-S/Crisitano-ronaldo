<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { background-color: #050505; }
    </style>
</head>
<body>
    <script>
        // Check if this is the user's first time visiting in this session
        if (!sessionStorage.getItem('visitedBefore')) {
            // 1st view: Mark as visited, then load the menu file
            sessionStorage.setItem('visitedBefore', 'true');
            window.location.replace('menu.html');
        } else {
            // 2nd view: They've been here, load the index content (now home.html)
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
