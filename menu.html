<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display&display=swap');

        body { 
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Cinzel', serif;
            color: #fff; 
        }

        .main-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid #d4af37;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        .header { 
            display: flex;
            justify-content: center;
            padding: 25px;
            gap: 15px; 
            border-bottom: 2px solid #d4af37;
            background: rgba(0,0,0,0.8);
            z-index: 2;
        }

        .main-content { 
            position: relative;
            flex: 1; 
            display: flex; 
            padding: 50px; 
            gap: 50px; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }

        /* ✅ ONLY CHANGE IS HERE */
        .background-clip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;

            /* 👇 LOWER % = subject moves DOWN */
            object-position: center 35%;

            z-index: 0;
        }

        .left-panel,
        .right-panel {
            z-index: 1;
        }

        .nav-btn {
            color: #d4af37;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #d4af37;
            text-transform: uppercase;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 15px #d4af37;
        }

        .left-panel { flex: 2; }

        h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 5rem;
            margin: 0;
            text-shadow: 0 0 20px #d4af37;
            letter-spacing: 5px;
        }

        .search-bar {
            width: 60%;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #d4af37;
            color: #fff;
            font-size: 1.2rem;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .display-img {
            width: 100%;
            height: 350px;
            border: 2px solid #d4af37;
            background: url('https://i.pinimg.com/736x/6e/00/73/6e0073bd72d1918c63d69f3543748d34.jpg')
                        no-repeat center / cover;
        }

        .walk-btn {
            padding: 20px;
            background: #d4af37;
            color: #000;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }

    </style>
</head>

<body>

<div class="main-container">

    <div class="header">
        <a href="#" class="nav-btn">Journey</a>
        <a href="#" class="nav-btn">Roots</a>
        <a href="#" class="nav-btn">Sporting</a>
        <a href="#" class="nav-btn">United</a>
        <a href="#" class="nav-btn">Madrid</a>
        <a href="#" class="nav-btn">Juventus</a>
        <a href="#" class="nav-btn">Al Nassr</a>
        <a href="#" class="nav-btn">Portugal</a>
        <a href="#" class="nav-btn">Career Stats</a>
    </div>

    <div class="main-content">

        <video autoplay muted loop playsinline class="background-clip">
            <source src="video.mp4.mp4" type="video/mp4">
        </video>

        <div class="left-panel">
            <h1>CAREER HIGHLIGHTS</h1>
            <input type="text" class="search-bar" placeholder="Search phases...">
        </div>

        <div class="right-panel">
            <div class="display-img"></div>
            <a href="#" class="walk-btn">BEGIN WALKTHROUGH</a>
        </div>

    </div>

</div>

</body>
</html>
