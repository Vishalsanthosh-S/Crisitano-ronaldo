<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Career Highlights</title>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display&display=swap');

body { 
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: 'Cinzel', serif;
    color: #fff; 
}

/* Outer Frame */
.main-container {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    bottom: 15px;
    border: 2px solid #d4af37;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Header */
.header { 
    display: flex;
    justify-content: center;
    padding: 25px;
    gap: 15px;
    border-bottom: 2px solid #d4af37;
    background: rgba(0,0,0,0.8);
    z-index: 2;
}

/* Main Area */
.main-content { 
    position: relative;
    flex: 1;
    overflow: hidden;
}

/* Background Video */
.background-clip {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}

/* Content Layer (padding goes here, NOT on main-content) */
.content-layer {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 50px;
    padding: 50px;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* Panels */
.left-panel {
    flex: 2;
}

.right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Buttons */
.nav-btn {
    color: #d4af37;
    text-decoration: none;
    padding: 8px 16px;
    border: 1px solid #d4af37;
    text-transform: uppercase;
    font-size: 0.7rem;
    transition: 0.3s;
}

.nav-btn:hover {
    background: #d4af37;
    color: #000;
    box-shadow: 0 0 15px #d4af37;
}

/* Title */
h1 {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 5rem;
    margin: 0;
    text-shadow: 0 0 20px #d4af37;
    letter-spacing: 5px;
}

/* Search */
.search-bar {
    width: 60%;
    padding: 15px;
    background: rgba(0,0,0,0.8);
    border: 2px solid #d4af37;
    color: #fff;
    font-size: 1.2rem;
}

/* Image Box */
.display-img {
    width: 100%;
    height: 350px;
    border: 2px solid #d4af37;
    background: url('https://i.pinimg.com/736x/6e/00/73/6e0073bd72d1918c63d69f3543748d34.jpg')
                no-repeat center center / cover;
}

/* Walk Button */
.walk-btn {
    padding: 20px;
    background: #d4af37;
    color: #000;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    text-transform: uppercase;
}

</style>
</head>

<body>

<div class="main-container">

    <div class="header">
        <a href="index.html" class="nav-btn">Journey</a>
        <a href="phase1.html" class="nav-btn">Roots</a>
        <a href="phase2.html" class="nav-btn">Sporting</a>
        <a href="phase3.html" class="nav-btn">United</a>
        <a href="phase4.html" class="nav-btn">Madrid</a>
        <a href="phase5.html" class="nav-btn">Juventus</a>
        <a href="phase6.html" class="nav-btn">Al Nassr</a>
        <a href="phase7.html" class="nav-btn">Portugal</a>
        <a href="phase8.html" class="nav-btn">Career Stats</a>
    </div>

    <div class="main-content">

        <video autoplay muted loop playsinline class="background-clip">
            <source src="video.mp4.mp4" type="video/mp4">
        </video>

        <div class="content-layer">
            <div class="left-panel">
                <h1>CAREER HIGHLIGHTS</h1>
                <input type="text" class="search-bar" placeholder="Search phases...">
            </div>

            <div class="right-panel">
                <div class="display-img"></div>
                <a href="index.html" class="walk-btn">Begin Walkthrough</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
