<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Career Highlights</title>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: 'Cinzel', serif;
    color: #fff;
}

/* OUTER FRAME */
.main-container {
    position: absolute;
    inset: 15px;
    border: 2px solid #d4af37;
    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 20px;
    border-bottom: 2px solid #d4af37;
    background: rgba(0,0,0,0.9);
    flex-shrink: 0;
}

/* NAV */
.nav-btn {
    color: #d4af37;
    text-decoration: none;
    padding: 8px 16px;
    border: 1px solid #d4af37;
    font-size: 0.7rem;
    text-transform: uppercase;
}

/* MAIN CONTENT */
.main-content {
    position: relative;
    flex: 1;
    display: grid;
    overflow: hidden;
}

/* VIDEO */
.background-clip {
    grid-area: 1 / 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* CONTENT LAYER */
.content-layer {
    grid-area: 1 / 1;
    display: flex;
    gap: 50px;
    padding: 50px;
    align-items: stretch;
    justify-content: space-between;
    z-index: 1;
}

/* LEFT */
.left-panel {
    flex: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* TITLE */
h1 {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 5rem;
    margin: 0 0 20px;
    letter-spacing: 5px;
    text-shadow: 0 0 20px #d4af37;
}

/* SEARCH */
.search-bar {
    width: 60%;
    padding: 15px;
    background: rgba(0,0,0,0.8);
    border: 2px solid #d4af37;
    color: #fff;
}

/* RIGHT */
.right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* IMAGE */
.display-img {
    width: 100%;
    aspect-ratio: 3 / 4;
    border: 2px solid #d4af37;
    background: url('https://i.pinimg.com/736x/6e/00/73/6e0073bd72d1918c63d69f3543748d34.jpg')
        no-repeat center / cover;
}

/* BUTTON */
.walk-btn {
    margin-top: 20px;
    padding: 18px;
    background: #d4af37;
    color: #000;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    text-transform: uppercase;
}
</style>
</head>

<body>

<div class="main-container">

    <div class="header">
        <a href="#" class="nav-btn">Journey</a>
        <a href="#" class="nav-btn">Roots</a>
        <a href="#" class="nav-btn">Sporting</a>
        <a href="#" class="nav-btn">United</a>
        <a href="#" class="nav-btn">Madrid</a>
        <a href="#" class="nav-btn">Juventus</a>
        <a href="#" class="nav-btn">Al Nassr</a>
        <a href="#" class="nav-btn">Portugal</a>
        <a href="#" class="nav-btn">Career Stats</a>
    </div>

    <div class="main-content">
        <video autoplay muted loop playsinline class="background-clip">
            <source src="video.mp4.mp4" type="video/mp4">
        </video>

        <div class="content-layer">
            <div class="left-panel">
                <h1>CAREER<br>HIGHLIGHTS</h1>
                <input type="text" class="search-bar" placeholder="Search phases...">
            </div>

            <div class="right-panel">
                <div class="display-img"></div>
                <a href="#" class="walk-btn">Begin Walkthrough</a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
