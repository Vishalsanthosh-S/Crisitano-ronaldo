<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinematic Hero</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: 'Cinzel', serif;
    color: #fff;
}

/* MAIN CONTAINER */
.hero {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* VIDEO / IMAGE CLIP */
.background-clip {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 58%; /* 👈 ONLY THIS VALUE CHANGED */
    z-index: 0;
}

/* DARK OVERLAY */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1;
}

/* CENTER CONTENT */
.content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* TEXT BOX */
.content-box {
    border: 2px solid rgba(255,255,255,0.6);
    padding: 40px 70px;
    backdrop-filter: blur(3px);
}

.content-box h1 {
    margin: 0;
    font-size: 48px;
    letter-spacing: 4px;
}

.content-box p {
    margin-top: 15px;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="hero">
    <!-- replace src with your video or image -->
    <video class="background-clip" autoplay muted loop>
        <source src="your-video.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="content">
        <div class="content-box">
            <h1>YOUR TITLE</h1>
            <p>Your cinematic subtitle goes here</p>
        </div>
    </div>
</div>

</body>
</html>
